<!DOCTYPE html>

<head>

    <title>Online Books - Home</title>

    <style>
        body {

            font-family: Arial;

            margin: 0;

            background: #f4f4f4;

        }

        nav {

            background: black;

            padding: 15px;

            text-align: center;

        }

        nav a {

            color: white;

            margin: 15px;

            text-decoration: none;

        }

        nav a:hover {

            color: yellow;

        }

        /* Slider */

        .slider {

            width: 60%;

            height: 300px;

            margin: 20px auto;

            overflow: hidden;

            border-radius: 10px;

        }

        .slides {

            display: flex;

            width: 600%;

            animation: slide 12s infinite;

        }

        .slides img {

            width: 100%;

            height: 300px;

        }

        @keyframes slide {

            0% {

                transform: translateX(0%);

            }

            16% {

                transform: translateX(0%);

            }

            20% {

                transform: translateX(-100%);

            }

            36% {

                transform: translateX(-100%);

            }

            40% {

                transform: translateX(-200%);

            }

            56% {

                transform: translateX(-200%);

            }

            60% {

                transform: translateX(-300%);

            }

            76% {

                transform: translateX(-300%);

            }

            80% {

                transform: translateX(-400%);

            }

            96% {

                transform: translateX(-400%);

            }

            100% {

                transform: translateX(0%);

            }

        }

        /* Cards */

        .cards {

            text-align: center;

            padding: 20px;

        }

        .card {

            display: inline-block;

            width: 250px;

            margin: 15px;

            padding: 15px;

            background: white;

            box-shadow: 0 0 10px gray;

            border-radius: 10px;

        }

        .card img {

            width: 100%;

            height: 180px;

            border-radius: 8px;

        }

        .card h3 {

            margin: 10px 0 5px;

        }

        .author {

            color: gray;

            font-size: 14px;

        }

        .desc {

            font-size: 14px;

            margin: 10px 0;

        }

        button {

            background: #007BFF;

            color: white;

            border: none;

            padding: 10px;

            border-radius: 5px;

            cursor: pointer;

        }

        button:hover {

            background: #0056b3;

        }
    </style>

</head>

<body>

</body>
